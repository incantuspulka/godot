rules:
  - id: "preserve-abi-and-compatibility-guards"
    name: "Preserve ABI and deprecated compatibility guards"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not introduce ABI-breaking public/extension changes in regular PRs, and keep deprecated APIs and compatibility paths guarded with DISABLE_DEPRECATED."
    llm:
      prompt: "Do not introduce ABI-breaking public/extension changes in regular PRs, and keep deprecated APIs and compatibility paths guarded with DISABLE_DEPRECATED."
  - id: "keep-core-module-boundaries-clean"
    name: "Keep core/editor/module boundaries clean"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not add dependencies from core runtime code to editor-only or modules code; use existing abstractions/interfaces instead."
    llm:
      prompt: "Do not add dependencies from core runtime code to editor-only or modules code; use existing abstractions/interfaces instead."
  - id: "avoid-unnecessary-copies-and-allocations"
    name: "Avoid unnecessary copies and allocations"
    type: llm
    severity: warning
    category: "performance"
    message: "In performance-sensitive paths, avoid extra temporaries, container/value copies, repeated lookups, and per-frame allocations by using const references, caching, and buffer reuse."
    llm:
      prompt: "In performance-sensitive paths, avoid extra temporaries, container/value copies, repeated lookups, and per-frame allocations by using const references, caching, and buffer reuse."
  - id: "follow-project-cpp-style-and-idioms"
    name: "Follow project C++ style and idioms"
    type: llm
    severity: warning
    category: "style"
    message: "Use established engine conventions for naming, signatures, tabs indentation, guard clauses, forward declarations, and existing helper/macros instead of ad-hoc patterns."
    llm:
      prompt: "Use established engine conventions for naming, signatures, tabs indentation, guard clauses, forward declarations, and existing helper/macros instead of ad-hoc patterns."
  - id: "use-godot-error-memory-stringname-idioms"
    name: "Use Godot error, memory, and StringName idioms"
    type: llm
    severity: warning
    category: "style"
    message: "Use project-standard ERR_FAIL/ERR_CONTINUE macros, Godot memory-management patterns, and StringName helpers (SceneStringName/CoreStringName/SNAME) rather than custom checks or raw string literals where StringName is expected."
    llm:
      prompt: "Use project-standard ERR_FAIL/ERR_CONTINUE macros, Godot memory-management patterns, and StringName helpers (SceneStringName/CoreStringName/SNAME) rather than custom checks or raw string literals where StringName is expected."
  - id: "keep-hot-paths-side-effect-free-and-fast"
    name: "Keep hot paths side-effect free and fast"
    type: llm
    severity: warning
    category: "performance"
    message: "Polling/per-frame/realtime paths must avoid side effects, blocking work, redundant calls, and log spam, and preserve early-return no-op guards where applicable."
    llm:
      prompt: "Polling/per-frame/realtime paths must avoid side effects, blocking work, redundant calls, and log spam, and preserve early-return no-op guards where applicable."
  - id: "keep-docs-aligned-and-style-compliant"
    name: "Keep docs aligned with behavior and style"
    type: llm
    severity: warning
    category: "patterns"
    message: "When public API or behavior changes, update class reference docs accurately and follow project documentation style (US English, consistent terminology, clear deprecation/replacement notes, and translatable UI text conventions)."
    llm:
      prompt: "When public API or behavior changes, update class reference docs accurately and follow project documentation style (US English, consistent terminology, clear deprecation/replacement notes, and translatable UI text conventions)."
  - id: "avoid-translation-and-doc-churn"
    name: "Avoid unnecessary doc and translation churn"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not make preference-only documentation rewrites or direct .po edits; keep documentation diffs focused and update translations through the approved localization workflow."
    llm:
      prompt: "Do not make preference-only documentation rewrites or direct .po edits; keep documentation diffs focused and update translations through the approved localization workflow."
  - id: "keep-pr-scope-focused"
    name: "Keep PR scope focused"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not mix unrelated refactors, feature additions in bugfix PRs, or leftover debug artifacts; keep each PR/issue focused on one intended change."
    llm:
      prompt: "Do not mix unrelated refactors, feature additions in bugfix PRs, or leftover debug artifacts; keep each PR/issue focused on one intended change."
  - id: "validate-public-inputs-and-types"
    name: "Validate public inputs and exposed types"
    type: llm
    severity: warning
    category: "security"
    message: "Enforce documented runtime parameter ranges and keep script/binding/property types consistent with storage and serialization semantics."
    llm:
      prompt: "Enforce documented runtime parameter ranges and keep script/binding/property types consistent with storage and serialization semantics."
  - id: "preserve-platform-and-thread-safety-guards"
    name: "Preserve platform/thread safety guards"
    type: llm
    severity: warning
    category: "security"
    message: "Retain required nullability, thread-availability, and synchronization guard patterns in platform and threaded code instead of weakening checks."
    llm:
      prompt: "Retain required nullability, thread-availability, and synchronization guard patterns in platform and threaded code instead of weakening checks."
  - id: "keep-ci-safety-and-api-checks-intact"
    name: "Keep CI safety and API compatibility checks intact"
    type: llm
    severity: warning
    category: "security"
    message: "Do not weaken required CI protections for submodules, API/doctool compatibility validation, secure branch-gated credentialed jobs, and shared build workflow patterns."
    llm:
      prompt: "Do not weaken required CI protections for submodules, API/doctool compatibility validation, secure branch-gated credentialed jobs, and shared build workflow patterns."
