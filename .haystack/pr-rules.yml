rules:
  - id: "cpp-naming-and-local-symbol-conventions"
    name: "Follow C++ naming and local symbol conventions"
    type: llm
    severity: warning
    category: "style"
    message: "Use Godot C++ naming conventions (snake_case, `p_` only for parameters, `r_` for output references, and file-local helpers with internal linkage)."
    llm:
      prompt: "Use Godot C++ naming conventions (snake_case, `p_` only for parameters, `r_` for output references, and file-local helpers with internal linkage)."
  - id: "prefer-godot-lifetime-and-error-macros"
    name: "Use Godot lifetime and error guard patterns"
    type: llm
    severity: warning
    category: "style"
    message: "Use Godot memory/lifetime and guard macros consistently (`Ref::instantiate`, `memnew/memdelete`, `ERR_FAIL_*`/`ERR_CONTINUE_*`) instead of ad-hoc allocation or validation patterns."
    llm:
      prompt: "Use Godot memory/lifetime and guard macros consistently (`Ref::instantiate`, `memnew/memdelete`, `ERR_FAIL_*`/`ERR_CONTINUE_*`) instead of ad-hoc allocation or validation patterns."
  - id: "deprecated-api-must-be-guarded"
    name: "Guard deprecated API paths"
    type: llm
    severity: warning
    category: "style"
    message: "Wrap deprecated-only code in `#ifndef DISABLE_DEPRECATED` and preserve required compatibility bindings/behavior when deprecating APIs."
    llm:
      prompt: "Wrap deprecated-only code in `#ifndef DISABLE_DEPRECATED` and preserve required compatibility bindings/behavior when deprecating APIs."
  - id: "prefer-forward-declarations-and-lean-headers"
    name: "Keep headers lightweight"
    type: llm
    severity: warning
    category: "performance"
    message: "Prefer forward declarations in headers and avoid unnecessary heavy includes when only pointers/references are needed."
    llm:
      prompt: "Prefer forward declarations in headers and avoid unnecessary heavy includes when only pointers/references are needed."
  - id: "avoid-unnecessary-copies-and-allocations"
    name: "Avoid avoidable copies and hot-path allocations"
    type: llm
    severity: warning
    category: "performance"
    message: "In performance-sensitive code, iterate/pass by reference, avoid needless container copies, and reuse buffers/objects instead of allocating per frame/call."
    llm:
      prompt: "In performance-sensitive code, iterate/pass by reference, avoid needless container copies, and reuse buffers/objects instead of allocating per frame/call."
  - id: "use-typed-apis-and-stable-identifiers"
    name: "Prefer typed APIs and stable identifiers"
    type: llm
    severity: warning
    category: "style"
    message: "Use typed casts/methods and stable IDs/constants (for example StringName constants and menu item IDs) instead of stringly-typed calls or hardcoded indexes."
    llm:
      prompt: "Use typed casts/methods and stable IDs/constants (for example StringName constants and menu item IDs) instead of stringly-typed calls or hardcoded indexes."
  - id: "remove-redundant-and-stale-code"
    name: "Keep code free of redundancy and leftovers"
    type: llm
    severity: warning
    category: "style"
    message: "Do not introduce redundant checks/variables/logic, and remove stale comments, dead code, and unused assets/includes when they become obsolete."
    llm:
      prompt: "Do not introduce redundant checks/variables/logic, and remove stale comments, dead code, and unused assets/includes when they become obsolete."
  - id: "keep-core-layer-decoupled"
    name: "Preserve core layering boundaries"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not introduce dependencies from `core/**` to higher-level editor/module code; use abstractions or signals to keep layering intact."
    llm:
      prompt: "Do not introduce dependencies from `core/**` to higher-level editor/module code; use abstractions or signals to keep layering intact."
  - id: "thread-safety-and-lock-order-discipline"
    name: "Maintain thread-safety and lock-order discipline"
    type: llm
    severity: warning
    category: "security"
    message: "Use established synchronization helpers and avoid unsafe shared pointer/container access patterns that can race, deadlock, or invalidate references across threads."
    llm:
      prompt: "Use established synchronization helpers and avoid unsafe shared pointer/container access patterns that can race, deadlock, or invalidate references across threads."
  - id: "no-blocking-work-in-realtime-paths"
    name: "Avoid blocking work in real-time paths"
    type: llm
    severity: warning
    category: "performance"
    message: "Do not add potentially blocking or heavy operations in real-time callbacks (such as audio/render hot paths); move them to non-real-time control flow."
    llm:
      prompt: "Do not add potentially blocking or heavy operations in real-time callbacks (such as audio/render hot paths); move them to non-real-time control flow."
  - id: "preserve-pr-scope-focus"
    name: "Keep PR changes tightly scoped"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not include unrelated refactors, formatting churn, or opportunistic edits outside the intended fix/feature scope."
    llm:
      prompt: "Do not include unrelated refactors, formatting churn, or opportunistic edits outside the intended fix/feature scope."
  - id: "docs-update-required-for-api-behavior-changes"
    name: "Update docs when public behavior changes"
    type: llm
    severity: warning
    category: "patterns"
    message: "When changing public or script-exposed API/behavior, update class reference and related user-facing docs/text in the same PR."
    llm:
      prompt: "When changing public or script-exposed API/behavior, update class reference and related user-facing docs/text in the same PR."
  - id: "follow-doc-style-and-language-rules"
    name: "Follow project documentation style"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use project doc conventions (concise technical tone, US English, Oxford comma, clear links, and user-facing API names) and avoid unnecessary wording churn."
    llm:
      prompt: "Use project doc conventions (concise technical tone, US English, Oxford comma, clear links, and user-facing API names) and avoid unnecessary wording churn."
  - id: "dont-edit-translation-po-files-directly"
    name: "Do not manually edit translation catalogs"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not edit `editor/translations/**/*.po` directly; treat them as managed by the localization workflow (for example Weblate)."
    llm:
      prompt: "Do not edit `editor/translations/**/*.po` directly; treat them as managed by the localization workflow (for example Weblate)."
  - id: "translation-macro-and-localization-correctness"
    name: "Use translation/localization APIs correctly"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use the correct translation macros by string type (`TTRC` for static literals, `TTR` for runtime strings) and refresh UI text on translation-change notifications when required."
    llm:
      prompt: "Use the correct translation macros by string type (`TTRC` for static literals, `TTR` for runtime strings) and refresh UI text on translation-change notifications when required."
  - id: "validate-inputs-and-documented-ranges"
    name: "Enforce runtime validation for inputs"
    type: llm
    severity: warning
    category: "security"
    message: "Add defensive validation for external pointers, invalid states, and documented parameter ranges instead of relying on assumptions or docs alone."
    llm:
      prompt: "Add defensive validation for external pointers, invalid states, and documented parameter ranges instead of relying on assumptions or docs alone."
  - id: "ci-workflows-must-preserve-coverage-guards"
    name: "Preserve critical CI coverage checks"
    type: llm
    severity: warning
    category: "patterns"
    message: "Workflow changes must retain essential gating/coverage behavior (source-change gating, API/docs sync checks, compatibility validation, and required matrix intent)."
    llm:
      prompt: "Workflow changes must retain essential gating/coverage behavior (source-change gating, API/docs sync checks, compatibility validation, and required matrix intent)."
