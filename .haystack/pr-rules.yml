rules:
  - id: "assertion-value-left-expected-right"
    name: "Put actual value on left in equality assertions"
    type: llm
    severity: warning
    category: "style"
    message: "Write CHECK_EQ-style assertions with the value under test on the left and the expected literal/value on the right."
    llm:
      prompt: "Write CHECK_EQ-style assertions with the value under test on the left and the expected literal/value on the right."
  - id: "follow-project-test-naming"
    name: "Follow project test naming conventions"
    type: llm
    severity: warning
    category: "style"
    message: "Name tests and SUBCASE labels using the repository’s established format and consistent phrasing."
    llm:
      prompt: "Name tests and SUBCASE labels using the repository’s established format and consistent phrasing."
  - id: "avoid-redundant-exception-wrapping"
    name: "Avoid duplicate exception wrappers"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not add local try/catch wrappers when higher-level code already provides exception handling and reporting."
    llm:
      prompt: "Do not add local try/catch wrappers when higher-level code already provides exception handling and reporting."
  - id: "name-apis-by-actual-semantics"
    name: "Name APIs by actual behavior"
    type: llm
    severity: warning
    category: "style"
    message: "Choose class and method names that accurately reflect implemented behavior and scope."
    llm:
      prompt: "Choose class and method names that accurately reflect implemented behavior and scope."
  - id: "update-tooling-for-new-doc-markup"
    name: "Update doc tooling for new markup"
    type: llm
    severity: warning
    category: "patterns"
    message: "When introducing new documentation markup patterns, update doc generation/parsing tooling instead of relying on ad-hoc text workarounds."
    llm:
      prompt: "When introducing new documentation markup patterns, update doc generation/parsing tooling instead of relying on ad-hoc text workarounds."
  - id: "deduplicate-validation-logic"
    name: "Centralize repeated validation logic"
    type: llm
    severity: warning
    category: "patterns"
    message: "Extract repeated parser or validation logic into shared helpers to keep behavior consistent."
    llm:
      prompt: "Extract repeated parser or validation logic into shared helpers to keep behavior consistent."
  - id: "reject-malformed-helper-inputs"
    name: "Reject malformed parser/helper input"
    type: llm
    severity: warning
    category: "patterns"
    message: "Parsing helpers and related tests must explicitly reject malformed input instead of silently accepting invalid formats."
    llm:
      prompt: "Parsing helpers and related tests must explicitly reject malformed input instead of silently accepting invalid formats."
  - id: "kotlin-proxy-null-safe-args"
    name: "Handle nullable InvocationHandler args safely"
    type: llm
    severity: warning
    category: "security"
    message: "In Android/Kotlin InvocationHandler proxy code, treat args as nullable and substitute an empty array for no-argument calls."
    llm:
      prompt: "In Android/Kotlin InvocationHandler proxy code, treat args as nullable and substitute an empty array for no-argument calls."
  - id: "kotlin-proxy-identity-equality"
    name: "Use identity equality in proxy identity checks"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use identity equality (===) rather than structural equality (==) for proxy/object identity checks in Kotlin proxy handlers."
    llm:
      prompt: "Use identity equality (===) rather than structural equality (==) for proxy/object identity checks in Kotlin proxy handlers."
  - id: "keep-hot-paths-side-effect-free"
    name: "Avoid side effects in polling/hot checks"
    type: llm
    severity: warning
    category: "performance"
    message: "Do not call helpers that mutate shared state from high-frequency polling or hot-path checks."
    llm:
      prompt: "Do not call helpers that mutate shared state from high-frequency polling or hot-path checks."
  - id: "use-deterministic-lock-ordering"
    name: "Use deterministic lock ordering for multi-lock code"
    type: llm
    severity: warning
    category: "security"
    message: "When acquiring multiple locks, use a stable deterministic order to prevent deadlocks."
    llm:
      prompt: "When acquiring multiple locks, use a stable deterministic order to prevent deadlocks."
  - id: "use-stringname-conventions-correctly"
    name: "Use StringName helpers only where appropriate"
    type: llm
    severity: warning
    category: "performance"
    message: "Use SceneStringName/CoreStringName/SNAME constants where engine conventions require them, but avoid adding StringName conversions when APIs expect plain String or paths are cold."
    llm:
      prompt: "Use SceneStringName/CoreStringName/SNAME constants where engine conventions require them, but avoid adding StringName conversions when APIs expect plain String or paths are cold."
  - id: "prefer-const-references-for-heavy-types"
    name: "Use const references to avoid copies"
    type: llm
    severity: warning
    category: "performance"
    message: "Prefer const-reference parameters and iteration for non-trivial/container types unless mutation is required."
    llm:
      prompt: "Prefer const-reference parameters and iteration for non-trivial/container types unless mutation is required."
  - id: "forward-declare-in-headers"
    name: "Prefer forward declarations in headers"
    type: llm
    severity: warning
    category: "performance"
    message: "In headers, forward declare types when only pointers/references are needed and move includes to implementation files."
    llm:
      prompt: "In headers, forward declare types when only pointers/references are needed and move includes to implementation files."
  - id: "never-include-cpp-files"
    name: "Do not include implementation files"
    type: llm
    severity: warning
    category: "patterns"
    message: "Never include .cpp files from other translation units; include headers instead."
    llm:
      prompt: "Never include .cpp files from other translation units; include headers instead."
  - id: "use-engine-memory-management-patterns"
    name: "Follow engine memory management idioms"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use project-standard allocation and lifetime patterns for engine objects instead of ad-hoc memory management."
    llm:
      prompt: "Use project-standard allocation and lifetime patterns for engine objects instead of ad-hoc memory management."
  - id: "avoid-unrelated-churn-in-prs"
    name: "Keep changes focused and avoid noise"
    type: llm
    severity: warning
    category: "style"
    message: "Do not mix unrelated formatting, whitespace, or incidental refactors into functional changes."
    llm:
      prompt: "Do not mix unrelated formatting, whitespace, or incidental refactors into functional changes."
  - id: "preserve-deprecated-compat-paths"
    name: "Keep deprecated compatibility paths intact"
    type: llm
    severity: warning
    category: "patterns"
    message: "When deprecating APIs, keep required compatibility declarations/emissions and guard deprecated code with DISABLE_DEPRECATED as needed."
    llm:
      prompt: "When deprecating APIs, keep required compatibility declarations/emissions and guard deprecated code with DISABLE_DEPRECATED as needed."
  - id: "follow-project-doc-style"
    name: "Follow established documentation style"
    type: llm
    severity: warning
    category: "patterns"
    message: "Documentation changes must match the repository’s style, tone, terminology, formatting, and linking conventions."
    llm:
      prompt: "Documentation changes must match the repository’s style, tone, terminology, formatting, and linking conventions."
  - id: "avoid-promotional-or-ai-doc-tone"
    name: "Keep docs concise and technical"
    type: llm
    severity: warning
    category: "patterns"
    message: "Write documentation in concise, technical project style and avoid verbose promotional or AI-polished phrasing."
    llm:
      prompt: "Write documentation in concise, technical project style and avoid verbose promotional or AI-polished phrasing."
  - id: "preserve-doc-technical-meaning"
    name: "Preserve technical meaning in doc edits"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not reword documentation in ways that alter technical semantics or constraints."
    llm:
      prompt: "Do not reword documentation in ways that alter technical semantics or constraints."
  - id: "avoid-redundant-doc-text"
    name: "Avoid redundant documentation text"
    type: llm
    severity: warning
    category: "patterns"
    message: "Remove documentation text that merely restates obvious type info or duplicates nearby explanations."
    llm:
      prompt: "Remove documentation text that merely restates obvious type info or duplicates nearby explanations."
  - id: "update-docs-with-api-or-ui-changes"
    name: "Update docs for user-visible/API changes"
    type: llm
    severity: warning
    category: "patterns"
    message: "When changing public APIs or user-visible labels/messages/behavior, update corresponding class reference and related docs in the same PR."
    llm:
      prompt: "When changing public APIs or user-visible labels/messages/behavior, update corresponding class reference and related docs in the same PR."
  - id: "do-not-edit-generated-po-files"
    name: "Do not edit translation .po files directly"
    type: llm
    severity: warning
    category: "patterns"
    message: "Never modify editor/translations/*.po manually because these files are generated and managed externally."
    llm:
      prompt: "Never modify editor/translations/*.po manually because these files are generated and managed externally."
  - id: "use-translation-macros-correctly"
    name: "Use translation APIs in correct contexts"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use translation macros/functions in their intended contexts and ensure user-visible text remains translatable and updates correctly on locale/theme changes."
    llm:
      prompt: "Use translation macros/functions in their intended contexts and ensure user-visible text remains translatable and updates correctly on locale/theme changes."
  - id: "prefer-existing-engine-helpers"
    name: "Use existing engine helpers over custom code"
    type: llm
    severity: warning
    category: "style"
    message: "When equivalent engine utility/helper APIs exist, use them instead of ad-hoc reimplementations."
    llm:
      prompt: "When equivalent engine utility/helper APIs exist, use them instead of ad-hoc reimplementations."
  - id: "avoid-redundant-logic-and-checks"
    name: "Remove redundant checks and duplicate logic"
    type: llm
    severity: warning
    category: "style"
    message: "Do not add conditions or calls already guaranteed by existing logic; keep a single authoritative path."
    llm:
      prompt: "Do not add conditions or calls already guaranteed by existing logic; keep a single authoritative path."
  - id: "keep-module-boundaries-clean"
    name: "Respect core/editor/module boundaries"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not introduce forbidden dependencies across major layers (for example core to modules/editor); use abstractions/decoupling instead."
    llm:
      prompt: "Do not introduce forbidden dependencies across major layers (for example core to modules/editor); use abstractions/decoupling instead."
  - id: "cache-repeated-hot-lookups"
    name: "Cache repeated hot-path lookups"
    type: llm
    severity: warning
    category: "performance"
    message: "Cache values used repeatedly in per-frame/per-item paths instead of re-querying each iteration."
    llm:
      prompt: "Cache values used repeatedly in per-frame/per-item paths instead of re-querying each iteration."
  - id: "avoid-hot-path-allocations"
    name: "Avoid allocations in hot paths"
    type: llm
    severity: warning
    category: "performance"
    message: "Do not allocate new objects/arrays in frequently called runtime paths when reusable storage is possible."
    llm:
      prompt: "Do not allocate new objects/arrays in frequently called runtime paths when reusable storage is possible."
  - id: "reserve-capacity-before-append-loops"
    name: "Reserve container capacity before append loops"
    type: llm
    severity: warning
    category: "performance"
    message: "Reserve destination container capacity from known source sizes before repeated appends."
    llm:
      prompt: "Reserve destination container capacity from known source sizes before repeated appends."
  - id: "validate-required-pointers"
    name: "Defensively validate required pointers"
    type: llm
    severity: warning
    category: "security"
    message: "Public or virtual extension entry points must validate required pointer parameters before use."
    llm:
      prompt: "Public or virtual extension entry points must validate required pointer parameters before use."
  - id: "avoid-unsafe-shared-pointer-lifetimes"
    name: "Protect shared-buffer pointer lifetimes"
    type: llm
    severity: warning
    category: "security"
    message: "Do not retain/use pointers across concurrent paths without explicit lifetime and synchronization guarantees."
    llm:
      prompt: "Do not retain/use pointers across concurrent paths without explicit lifetime and synchronization guarantees."
  - id: "enforce-documented-parameter-ranges"
    name: "Enforce documented parameter ranges in code"
    type: llm
    severity: warning
    category: "patterns"
    message: "When public docs define valid numeric ranges, enforce them with runtime guards."
    llm:
      prompt: "When public docs define valid numeric ranges, enforce them with runtime guards."
  - id: "keep-binding-types-consistent"
    name: "Keep binding types aligned with storage"
    type: llm
    severity: warning
    category: "patterns"
    message: "Script-exposed property and method types must match underlying storage types to avoid truncation/serialization issues."
    llm:
      prompt: "Script-exposed property and method types must match underlying storage types to avoid truncation/serialization issues."
  - id: "hide-internal-or-derived-inspector-properties"
    name: "Hide non-user-settable inspector properties"
    type: llm
    severity: warning
    category: "style"
    message: "Mark derived/internal/read-only properties with appropriate non-editable/non-serialized usage flags so they are not exposed as user-editable fields."
    llm:
      prompt: "Mark derived/internal/read-only properties with appropriate non-editable/non-serialized usage flags so they are not exposed as user-editable fields."
  - id: "use-engine-int-conventions-in-bindings"
    name: "Use engine integer conventions for script APIs"
    type: llm
    severity: warning
    category: "style"
    message: "Use project-standard integer types for script-exposed counts/indices."
    llm:
      prompt: "Use project-standard integer types for script-exposed counts/indices."
  - id: "give-file-local-helpers-internal-linkage"
    name: "Keep file-local helpers internal"
    type: llm
    severity: warning
    category: "patterns"
    message: "Mark translation-unit-only helpers/constants with internal linkage unless intentionally exported."
    llm:
      prompt: "Mark translation-unit-only helpers/constants with internal linkage unless intentionally exported."
  - id: "preserve-const-correctness"
    name: "Do not cast away const for mutation"
    type: llm
    severity: warning
    category: "patterns"
    message: "Avoid const-cast/C-style casts that bypass const correctness; use mutable cache fields or non-const APIs when mutation is required."
    llm:
      prompt: "Avoid const-cast/C-style casts that bypass const correctness; use mutable cache fields or non-const APIs when mutation is required."
  - id: "use-callable-is-valid"
    name: "Use Callable.is_valid for callable checks"
    type: llm
    severity: warning
    category: "patterns"
    message: "Check Callable validity with is_valid() rather than is_null()."
    llm:
      prompt: "Check Callable validity with is_valid() rather than is_null()."
  - id: "handle-negative-sentinel-lengths"
    name: "Guard against negative sentinel lengths"
    type: llm
    severity: warning
    category: "patterns"
    message: "When APIs may return negative sentinel lengths/counts, guard explicitly before using values."
    llm:
      prompt: "When APIs may return negative sentinel lengths/counts, guard explicitly before using values."
  - id: "follow-cpp-style-and-naming"
    name: "Follow project C++ style and naming"
    type: llm
    severity: warning
    category: "style"
    message: "Follow established C++ naming/style conventions (including snake_case and parameter prefix rules) and preserve existing file indentation/formatting."
    llm:
      prompt: "Follow established C++ naming/style conventions (including snake_case and parameter prefix rules) and preserve existing file indentation/formatting."
  - id: "prefer-guard-clauses"
    name: "Use guard clauses to reduce deep nesting"
    type: llm
    severity: warning
    category: "style"
    message: "Prefer early-return guard clauses in deeply nested control flow where it improves clarity."
    llm:
      prompt: "Prefer early-return guard clauses in deeply nested control flow where it improves clarity."
  - id: "use-menu-item-ids-not-indexes"
    name: "Use menu item IDs instead of hardcoded indexes"
    type: llm
    severity: warning
    category: "style"
    message: "Use stable menu item IDs (and index lookup helpers) rather than positional indexes for menu state/actions."
    llm:
      prompt: "Use stable menu item IDs (and index lookup helpers) rather than positional indexes for menu state/actions."
  - id: "keep-resource-scanning-lightweight"
    name: "Keep resource scanning lightweight"
    type: llm
    severity: warning
    category: "performance"
    message: "Avoid loading all subresources during project/resource scans when metadata/class queries can provide needed information."
    llm:
      prompt: "Avoid loading all subresources during project/resource scans when metadata/class queries can provide needed information."
  - id: "update-openxr-state-only-on-success"
    name: "Update OpenXR cached state only after success"
    type: llm
    severity: warning
    category: "patterns"
    message: "In OpenXR creation/resize flows, update cached state only after successful operations so retries remain valid."
    llm:
      prompt: "In OpenXR creation/resize flows, update cached state only after successful operations so retries remain valid."
  - id: "document-thread-safety-assumptions"
    name: "Document non-obvious thread-safety assumptions"
    type: llm
    severity: warning
    category: "patterns"
    message: "Add explicit comments when correctness relies on subtle thread-safety or lifetime invariants."
    llm:
      prompt: "Add explicit comments when correctness relies on subtle thread-safety or lifetime invariants."
  - id: "prefer-warning-over-disabling-checks"
    name: "Downgrade noisy checks rather than removing them"
    type: llm
    severity: warning
    category: "patterns"
    message: "If a safety/validation check is noisy during transition, prefer warning-level handling instead of fully disabling it."
    llm:
      prompt: "If a safety/validation check is noisy during transition, prefer warning-level handling instead of fully disabling it."
  - id: "guard-threaded-code-with-threads-enabled"
    name: "Gate threaded paths with THREADS_ENABLED"
    type: llm
    severity: warning
    category: "patterns"
    message: "Condition threaded behavior on THREADS_ENABLED so non-threaded builds remain valid."
    llm:
      prompt: "Condition threaded behavior on THREADS_ENABLED so non-threaded builds remain valid."
  - id: "keep-export-notifier-lifetime-valid"
    name: "Preserve notifier lifetime across full operation"
    type: llm
    severity: warning
    category: "patterns"
    message: "Ensure export/build notifier objects remain alive for the entire operation lifecycle."
    llm:
      prompt: "Ensure export/build notifier objects remain alive for the entire operation lifecycle."
  - id: "dont-claim-unloadable-resources"
    name: "Only recognize resources loaders can load"
    type: llm
    severity: warning
    category: "patterns"
    message: "Resource format loaders must not claim paths they cannot actually load in uncached/fresh conditions."
    llm:
      prompt: "Resource format loaders must not claim paths they cannot actually load in uncached/fresh conditions."
  - id: "avoid-blocking-realtime-audio-paths"
    name: "Avoid blocking work in real-time threads"
    type: llm
    severity: warning
    category: "performance"
    message: "Do not add potentially blocking initialization/reconnection work to real-time audio processing paths."
    llm:
      prompt: "Do not add potentially blocking initialization/reconnection work to real-time audio processing paths."
  - id: "preserve-order-dependent-command-semantics"
    name: "Preserve semantics when sorting/batching commands"
    type: llm
    severity: warning
    category: "performance"
    message: "When adding command sorting/batching, explicitly protect order-dependent command behavior."
    llm:
      prompt: "When adding command sorting/batching, explicitly protect order-dependent command behavior."
  - id: "use-filedialog-over-direct-displayserver-dialogs"
    name: "Use FileDialog for file selection flows"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use FileDialog abstractions instead of direct DisplayServer file dialog calls in UI/editor flows."
    llm:
      prompt: "Use FileDialog abstractions instead of direct DisplayServer file dialog calls in UI/editor flows."
  - id: "ci-checkout-submodules-recursive"
    name: "Checkout recursive submodules in CI"
    type: llm
    severity: warning
    category: "patterns"
    message: "GitHub Actions checkout steps for builds must use submodules: recursive when third-party sources are required."
    llm:
      prompt: "GitHub Actions checkout steps for builds must use submodules: recursive when third-party sources are required."
  - id: "ci-restrict-firebase-credentials-scope"
    name: "Restrict Firebase credentialed tests to trusted context"
    type: llm
    severity: warning
    category: "security"
    message: "Firebase Test Lab credentialed steps must run only on pushes to the main repository default branch, not on PRs/forks."
    llm:
      prompt: "Firebase Test Lab credentialed steps must run only on pushes to the main repository default branch, not on PRs/forks."
  - id: "ci-keep-doctool-api-drift-check"
    name: "Keep doctool API drift check in doc CI"
    type: llm
    severity: warning
    category: "patterns"
    message: "Doc test jobs must run doctool diff checks so public API changes include class reference updates."
    llm:
      prompt: "Doc test jobs must run doctool diff checks so public API changes include class reference updates."
