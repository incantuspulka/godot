rules:
  - id: "cpp-no-cpp-includes"
    name: "Do not include .cpp files"
    type: llm
    severity: warning
    category: "style"
    message: "Never include implementation (.cpp) files; include headers instead."
    llm:
      prompt: "Never include implementation (.cpp) files; include headers instead."
  - id: "cpp-forward-declare-in-headers"
    name: "Prefer forward declarations in headers"
    type: llm
    severity: warning
    category: "performance"
    message: "In headers, forward declare types when only pointers or references are needed and move heavy includes to source files."
    llm:
      prompt: "In headers, forward declare types when only pointers or references are needed and move heavy includes to source files."
  - id: "cpp-use-reference-in-range-loops"
    name: "Use references in range loops"
    type: llm
    severity: warning
    category: "performance"
    message: "Use const or non-const references in C++ range-based loops instead of by-value iteration unless copying is intentional."
    llm:
      prompt: "Use const or non-const references in C++ range-based loops instead of by-value iteration unless copying is intentional."
  - id: "cpp-avoid-unnecessary-copies-hot-paths"
    name: "Avoid unnecessary copies and repeated lookups"
    type: llm
    severity: warning
    category: "performance"
    message: "In hot paths, avoid avoidable allocations/copies and cache repeated lookups/settings outside loops."
    llm:
      prompt: "In hot paths, avoid avoidable allocations/copies and cache repeated lookups/settings outside loops."
  - id: "cpp-const-correctness-no-const-cast"
    name: "Preserve const-correctness"
    type: llm
    severity: warning
    category: "style"
    message: "Do not cast away constness; use proper const design or mutable caches where justified."
    llm:
      prompt: "Do not cast away constness; use proper const design or mutable caches where justified."
  - id: "cpp-file-local-static-helpers"
    name: "Use internal linkage for file-local helpers"
    type: llm
    severity: warning
    category: "style"
    message: "Mark helper functions as static when they are only used within a single .cpp file."
    llm:
      prompt: "Mark helper functions as static when they are only used within a single .cpp file."
  - id: "cpp-snake-case-and-prefix-conventions"
    name: "Follow C++ naming conventions"
    type: llm
    severity: warning
    category: "style"
    message: "Use snake_case identifiers, reserve p_ for parameters, and use r_ for output reference parameters."
    llm:
      prompt: "Use snake_case identifiers, reserve p_ for parameters, and use r_ for output reference parameters."
  - id: "cpp-use-godot-memory-and-error-idioms"
    name: "Use Godot memory and error idioms"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use Godot allocation/lifetime patterns and ERR_FAIL/WARN macros with clear context instead of ad-hoc memory or silent failure handling."
    llm:
      prompt: "Use Godot allocation/lifetime patterns and ERR_FAIL/WARN macros with clear context instead of ad-hoc memory or silent failure handling."
  - id: "cpp-guard-preconditions"
    name: "Validate preconditions before engine calls"
    type: llm
    severity: warning
    category: "security"
    message: "Add ERR_FAIL-style checks for invalid object/state/argument preconditions before calling engine APIs."
    llm:
      prompt: "Add ERR_FAIL-style checks for invalid object/state/argument preconditions before calling engine APIs."
  - id: "cpp-early-return-noop-setters"
    name: "Early return on unchanged setter values"
    type: llm
    severity: warning
    category: "performance"
    message: "In setters, return early when the new value equals the current value to avoid redundant work and side effects."
    llm:
      prompt: "In setters, return early when the new value equals the current value to avoid redundant work and side effects."
  - id: "cpp-use-typed-apis-over-reflection"
    name: "Prefer typed APIs over dynamic reflection"
    type: llm
    severity: warning
    category: "style"
    message: "Use typed engine helpers/casts/checks instead of dynamic name-based reflection when an equivalent typed API exists."
    llm:
      prompt: "Use typed engine helpers/casts/checks instead of dynamic name-based reflection when an equivalent typed API exists."
  - id: "cpp-use-stringname-helpers-appropriately"
    name: "Use StringName helpers appropriately"
    type: llm
    severity: warning
    category: "performance"
    message: "Use SceneStringName/CoreStringName/SNAME for reused identifiers in hot paths, but avoid unnecessary interning for one-off or String-only APIs."
    llm:
      prompt: "Use SceneStringName/CoreStringName/SNAME for reused identifiers in hot paths, but avoid unnecessary interning for one-off or String-only APIs."
  - id: "cpp-preserve-deprecated-compatibility-guards"
    name: "Preserve deprecated API compatibility guards"
    type: llm
    severity: warning
    category: "patterns"
    message: "Keep deprecated APIs and compatibility behavior consistently wrapped and registered under DISABLE_DEPRECATED guards."
    llm:
      prompt: "Keep deprecated APIs and compatibility behavior consistently wrapped and registered under DISABLE_DEPRECATED guards."
  - id: "api-preserve-compatibility"
    name: "Preserve public API compatibility"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not introduce breaking renames or enum/interface behavior changes without a documented compatibility or migration path."
    llm:
      prompt: "Do not introduce breaking renames or enum/interface behavior changes without a documented compatibility or migration path."
  - id: "bindings-keep-types-and-exposure-consistent"
    name: "Keep bindings consistent with storage and visibility"
    type: llm
    severity: warning
    category: "patterns"
    message: "Ensure script-exposed properties/methods/enums are fully bound with types and visibility that match underlying storage and intended API surface."
    llm:
      prompt: "Ensure script-exposed properties/methods/enums are fully bound with types and visibility that match underlying storage and intended API surface."
  - id: "core-must-not-depend-on-editor-or-modules"
    name: "Keep core layer independent"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not introduce direct core dependencies on editor or module code; use abstractions/signals/interfaces instead."
    llm:
      prompt: "Do not introduce direct core dependencies on editor or module code; use abstractions/signals/interfaces instead."
  - id: "editor-runtime-separation"
    name: "Keep editor-only code out of runtime paths"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not depend on editor-only code from runtime/scene modules; apply editor behavior through editor-side integration points."
    llm:
      prompt: "Do not depend on editor-only code from runtime/scene modules; apply editor behavior through editor-side integration points."
  - id: "editor-use-undoredo-for-scene-state"
    name: "Use UndoRedo for editor scene mutations"
    type: llm
    severity: warning
    category: "patterns"
    message: "Record editor-created or modified node/property state with UndoRedo so live-editing and sync behavior remains correct."
    llm:
      prompt: "Record editor-created or modified node/property state with UndoRedo so live-editing and sync behavior remains correct."
  - id: "editor-preserve-selection-caret-and-multiselect"
    name: "Preserve editor selection and caret behavior"
    type: llm
    severity: warning
    category: "style"
    message: "Use text/scene APIs that preserve caret, multi-selection, and intended full-selection action semantics."
    llm:
      prompt: "Use text/scene APIs that preserve caret, multi-selection, and intended full-selection action semantics."
  - id: "editor-use-stable-menu-ids"
    name: "Use stable menu item IDs"
    type: llm
    severity: warning
    category: "style"
    message: "Use menu item IDs with lookup helpers instead of hardcoded menu indexes."
    llm:
      prompt: "Use menu item IDs with lookup helpers instead of hardcoded menu indexes."
  - id: "ui-text-style-and-translation-safe"
    name: "Follow UI text and translation conventions"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use project UI casing/wording conventions and translation-safe patterns/macros for user-facing text."
    llm:
      prompt: "Use project UI casing/wording conventions and translation-safe patterns/macros for user-facing text."
  - id: "docs-update-for-api-and-user-visible-changes"
    name: "Update docs for exposed API or behavior changes"
    type: llm
    severity: warning
    category: "patterns"
    message: "When public API or user-visible behavior changes, update corresponding class reference documentation in the same change."
    llm:
      prompt: "When public API or user-visible behavior changes, update corresponding class reference documentation in the same change."
  - id: "docs-follow-style-and-us-english"
    name: "Follow documentation style conventions"
    type: llm
    severity: warning
    category: "patterns"
    message: "Write docs in project style (including US English and required punctuation conventions) with concise technical tone."
    llm:
      prompt: "Write docs in project style (including US English and required punctuation conventions) with concise technical tone."
  - id: "docs-avoid-unnecessary-wording-churn"
    name: "Avoid unnecessary documentation churn"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not make wording-only doc rewrites that add little value and unnecessarily invalidate translations."
    llm:
      prompt: "Do not make wording-only doc rewrites that add little value and unnecessarily invalidate translations."
  - id: "docs-no-direct-po-edits"
    name: "Do not edit translation .po files directly"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not manually modify autogenerated translation .po files; use the project translation workflow."
    llm:
      prompt: "Do not manually modify autogenerated translation .po files; use the project translation workflow."
  - id: "platform-guard-platform-specific-codepaths"
    name: "Guard platform-specific code correctly"
    type: llm
    severity: warning
    category: "patterns"
    message: "Gate platform/thread-specific behavior with the correct compile/runtime guards and avoid leaking logic to unsupported targets."
    llm:
      prompt: "Gate platform/thread-specific behavior with the correct compile/runtime guards and avoid leaking logic to unsupported targets."
  - id: "performance-no-per-frame-allocations"
    name: "Avoid per-frame allocations in hot paths"
    type: llm
    severity: warning
    category: "performance"
    message: "Do not allocate new objects/arrays in frequently called per-frame or input paths; reuse buffers where possible."
    llm:
      prompt: "Do not allocate new objects/arrays in frequently called per-frame or input paths; reuse buffers where possible."
  - id: "audio-no-blocking-realtime-thread"
    name: "Avoid blocking operations in real-time audio threads"
    type: llm
    severity: warning
    category: "performance"
    message: "Do not add potentially stalling or blocking work in real-time audio thread paths."
    llm:
      prompt: "Do not add potentially stalling or blocking work in real-time audio thread paths."
  - id: "rendering-preserve-order-dependent-ops"
    name: "Preserve order-dependent rendering semantics"
    type: llm
    severity: warning
    category: "performance"
    message: "When batching/sorting or optimizing rendering commands, keep explicit handling for operations whose correctness depends on execution order."
    llm:
      prompt: "When batching/sorting or optimizing rendering commands, keep explicit handling for operations whose correctness depends on execution order."
  - id: "resource-loading-safe-teardown"
    name: "Handle in-flight resource loads during teardown"
    type: llm
    severity: warning
    category: "security"
    message: "Ensure resource loader shutdown paths safely stop or drain active loads to prevent hangs/deadlocks."
    llm:
      prompt: "Ensure resource loader shutdown paths safely stop or drain active loads to prevent hangs/deadlocks."
  - id: "vulkan-resize-after-returned-count"
    name: "Resize arrays after Vulkan count queries"
    type: llm
    severity: warning
    category: "security"
    message: "After Vulkan calls that update output counts, resize destination arrays to the returned count before further use."
    llm:
      prompt: "After Vulkan calls that update output counts, resize destination arrays to the returned count before further use."
  - id: "ci-gate-secret-backed-steps"
    name: "Gate secret-backed CI steps"
    type: llm
    severity: warning
    category: "security"
    message: "Restrict secret-using CI steps to trusted contexts and do not run them on untrusted pull requests."
    llm:
      prompt: "Restrict secret-using CI steps to trusted contexts and do not run them on untrusted pull requests."
  - id: "ci-preserve-required-build-workflow-basics"
    name: "Preserve required CI build workflow conventions"
    type: llm
    severity: warning
    category: "patterns"
    message: "Keep required workflow conventions such as shared SCons flags, recursive submodule checkout, and approved local composite actions."
    llm:
      prompt: "Keep required workflow conventions such as shared SCons flags, recursive submodule checkout, and approved local composite actions."
