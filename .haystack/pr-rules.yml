rules:
  - id: "require-tests-for-behavior-changes"
    name: "Require tests for behavior changes"
    type: llm
    severity: warning
    category: "patterns"
    message: "Add or update tests in the same PR when changing runtime or user-visible behavior."
    llm:
      prompt: "Add or update tests in the same PR when changing runtime or user-visible behavior."
  - id: "use-engine-error-guards"
    name: "Use engine error guard macros"
    type: llm
    severity: warning
    category: "style"
    message: "Use project ERR_* guard macros for precondition checks and early returns instead of ad-hoc handling."
    llm:
      prompt: "Use project ERR_* guard macros for precondition checks and early returns instead of ad-hoc handling."
  - id: "update-docs-for-api-behavior-changes"
    name: "Update docs for API and behavior changes"
    type: llm
    severity: warning
    category: "patterns"
    message: "When public APIs or user-visible behavior change, update the corresponding class reference documentation in the same PR."
    llm:
      prompt: "When public APIs or user-visible behavior change, update the corresponding class reference documentation in the same PR."
  - id: "follow-doc-style-and-accuracy"
    name: "Follow documentation style and accuracy rules"
    type: llm
    severity: warning
    category: "patterns"
    message: "Keep documentation concise, consistent, and factual, preserve important caveats, and ensure wording matches actual engine behavior."
    llm:
      prompt: "Keep documentation concise, consistent, and factual, preserve important caveats, and ensure wording matches actual engine behavior."
  - id: "avoid-unnecessary-doc-churn"
    name: "Avoid unnecessary documentation churn"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not perform phrasing-only doc rewrites or edits that needlessly invalidate translations without clear technical clarity gains."
    llm:
      prompt: "Do not perform phrasing-only doc rewrites or edits that needlessly invalidate translations without clear technical clarity gains."
  - id: "do-not-edit-generated-translation-files"
    name: "Do not edit generated translation files directly"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not manually modify editor/translations/*.po files because they are generated and managed externally."
    llm:
      prompt: "Do not manually modify editor/translations/*.po files because they are generated and managed externally."
  - id: "follow-cpp-style-and-naming-conventions"
    name: "Follow C++ style and naming conventions"
    type: llm
    severity: warning
    category: "style"
    message: "Use project C++ conventions for snake_case naming, parameter/output prefixes, const-correct signatures, and idiomatic control flow."
    llm:
      prompt: "Use project C++ conventions for snake_case naming, parameter/output prefixes, const-correct signatures, and idiomatic control flow."
  - id: "prefer-existing-engine-helpers-and-conventions"
    name: "Prefer existing engine helpers and conventions"
    type: llm
    severity: warning
    category: "style"
    message: "Use established engine helpers and conventions (e.g., StringName/signal/input helpers) instead of reimplementing equivalent logic."
    llm:
      prompt: "Use established engine helpers and conventions (e.g., StringName/signal/input helpers) instead of reimplementing equivalent logic."
  - id: "avoid-trivial-abstractions-and-dead-code"
    name: "Avoid trivial abstractions and dead code"
    type: llm
    severity: warning
    category: "style"
    message: "Do not add low-value helper wrappers, and remove unused variables, stale comments, debug leftovers, and unreachable checks."
    llm:
      prompt: "Do not add low-value helper wrappers, and remove unused variables, stale comments, debug leftovers, and unreachable checks."
  - id: "keep-pr-scope-focused"
    name: "Keep changes scoped to intent"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not mix unrelated refactors or drive-by edits into a PR; keep changes focused on the stated fix or feature."
    llm:
      prompt: "Do not mix unrelated refactors or drive-by edits into a PR; keep changes focused on the stated fix or feature."
  - id: "use-efficient-data-access-patterns"
    name: "Use efficient data access patterns"
    type: llm
    severity: warning
    category: "performance"
    message: "Prefer const references, direct iteration, cached lookups, and buffer reuse to avoid unnecessary allocations and copies in hot paths."
    llm:
      prompt: "Prefer const references, direct iteration, cached lookups, and buffer reuse to avoid unnecessary allocations and copies in hot paths."
  - id: "keep-includes-minimal"
    name: "Keep includes minimal and correct"
    type: llm
    severity: warning
    category: "performance"
    message: "Prefer forward declarations in headers, avoid unnecessary includes, and never include .cpp files."
    llm:
      prompt: "Prefer forward declarations in headers, avoid unnecessary includes, and never include .cpp files."
  - id: "respect-layering-boundaries"
    name: "Respect module layering boundaries"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not introduce dependencies from core code to editor or modules; use abstraction boundaries instead."
    llm:
      prompt: "Do not introduce dependencies from core code to editor or modules; use abstraction boundaries instead."
  - id: "preserve-public-api-compatibility"
    name: "Preserve public API compatibility"
    type: llm
    severity: warning
    category: "patterns"
    message: "Keep public API signatures, enum values, deprecations, and compatibility paths stable, guarding deprecated code with DISABLE_DEPRECATED where required."
    llm:
      prompt: "Keep public API signatures, enum values, deprecations, and compatibility paths stable, guarding deprecated code with DISABLE_DEPRECATED where required."
  - id: "use-engine-memory-and-lifetime-idioms"
    name: "Use engine memory and lifetime idioms"
    type: llm
    severity: warning
    category: "security"
    message: "Follow project ownership patterns such as Ref<T>::instantiate and memnew/memdelete, and avoid unsafe shared mutable access across threads."
    llm:
      prompt: "Follow project ownership patterns such as Ref<T>::instantiate and memnew/memdelete, and avoid unsafe shared mutable access across threads."
  - id: "validate-inputs-and-documented-constraints"
    name: "Validate inputs and documented constraints"
    type: llm
    severity: warning
    category: "patterns"
    message: "Enforce documented parameter ranges and path validity in code with appropriate runtime guards."
    llm:
      prompt: "Enforce documented parameter ranges and path validity in code with appropriate runtime guards."
  - id: "avoid-blocking-or-heavy-work-in-realtime-paths"
    name: "Keep realtime and polling paths lightweight"
    type: llm
    severity: warning
    category: "performance"
    message: "Do not add blocking operations, mutating state calls, or per-event allocations in audio, polling, and high-frequency input paths."
    llm:
      prompt: "Do not add blocking operations, mutating state calls, or per-event allocations in audio, polling, and high-frequency input paths."
  - id: "preserve-error-context"
    name: "Preserve underlying error context"
    type: llm
    severity: warning
    category: "patterns"
    message: "When propagating failures, keep specific underlying error codes/messages rather than replacing them with generic results."
    llm:
      prompt: "When propagating failures, keep specific underlying error codes/messages rather than replacing them with generic results."
  - id: "require-repro-for-bugfixes"
    name: "Require reproduction details for bug fixes"
    type: llm
    severity: warning
    category: "patterns"
    message: "Bug-fix PRs must include clear reproduction steps or a minimal reproduction project."
    llm:
      prompt: "Bug-fix PRs must include clear reproduction steps or a minimal reproduction project."
