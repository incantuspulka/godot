rules:
  - id: "use-engine-guard-macros"
    name: "Use engine guard macros for preconditions"
    type: llm
    severity: warning
    category: "style"
    message: "In engine C++ code, validate invalid/null preconditions with ERR_FAIL_* guard macros and early returns instead of ad-hoc failure flow."
    llm:
      prompt: "In engine C++ code, validate invalid/null preconditions with ERR_FAIL_* guard macros and early returns instead of ad-hoc failure flow."
  - id: "use-correct-engine-ownership-patterns"
    name: "Use engine ownership and allocation patterns"
    type: llm
    severity: warning
    category: "patterns"
    message: "Instantiate and manage engine object lifetimes with project conventions (for example Ref<T>::instantiate for RefCounted and proper memnew/memdelete pairing) instead of raw or ad-hoc ownership."
    llm:
      prompt: "Instantiate and manage engine object lifetimes with project conventions (for example Ref<T>::instantiate for RefCounted and proper memnew/memdelete pairing) instead of raw or ad-hoc ownership."
  - id: "reuse-existing-constants-and-helpers"
    name: "Reuse existing constants and helpers"
    type: llm
    severity: warning
    category: "style"
    message: "Do not hard-code literals or duplicate logic when an existing centralized constant, API, or helper already provides the behavior."
    llm:
      prompt: "Do not hard-code literals or duplicate logic when an existing centralized constant, API, or helper already provides the behavior."
  - id: "keep-changes-scoped"
    name: "Keep changes scoped to intent"
    type: llm
    severity: warning
    category: "style"
    message: "Do not include unrelated refactors, formatting churn, or incidental edits outside the files and logic required by the intended change."
    llm:
      prompt: "Do not include unrelated refactors, formatting churn, or incidental edits outside the files and logic required by the intended change."
  - id: "update-docs-for-api-and-behavior-changes"
    name: "Update docs for exposed changes"
    type: llm
    severity: warning
    category: "patterns"
    message: "When adding or changing user-visible API or behavior, update the corresponding class reference/documentation in the same PR."
    llm:
      prompt: "When adding or changing user-visible API or behavior, update the corresponding class reference/documentation in the same PR."
  - id: "follow-doc-style-and-limit-translation-churn"
    name: "Follow documentation style and minimize churn"
    type: llm
    severity: warning
    category: "patterns"
    message: "Follow project documentation style conventions and avoid broad wording-only rewrites that invalidate translations without meaningful clarity or correctness gains."
    llm:
      prompt: "Follow project documentation style conventions and avoid broad wording-only rewrites that invalidate translations without meaningful clarity or correctness gains."
  - id: "do-not-edit-generated-translation-files"
    name: "Do not edit generated translation files directly"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not manually modify managed/autogenerated translation .po files; use the localization workflow."
    llm:
      prompt: "Do not manually modify managed/autogenerated translation .po files; use the localization workflow."
  - id: "use-correct-translation-apis-and-refresh-hooks"
    name: "Use translation APIs correctly"
    type: llm
    severity: warning
    category: "patterns"
    message: "Use TTRC only for static strings, use TTR for runtime strings, and refresh translated UI text on translation-change notifications."
    llm:
      prompt: "Use TTRC only for static strings, use TTR for runtime strings, and refresh translated UI text on translation-change notifications."
  - id: "follow-cpp-naming-and-local-conventions"
    name: "Follow C++ naming conventions"
    type: llm
    severity: warning
    category: "style"
    message: "Use project C++ naming conventions (such as snake_case, p_ for parameters, and r_ for output references) and reserve them for their intended scopes."
    llm:
      prompt: "Use project C++ naming conventions (such as snake_case, p_ for parameters, and r_ for output references) and reserve them for their intended scopes."
  - id: "use-forward-declarations-when-possible"
    name: "Prefer forward declarations in headers"
    type: llm
    severity: warning
    category: "performance"
    message: "In header files, prefer forward declarations over includes when only declarations/pointers/references are needed."
    llm:
      prompt: "In header files, prefer forward declarations over includes when only declarations/pointers/references are needed."
  - id: "prefer-const-references-for-readonly-nontrivial-values"
    name: "Prefer const references for readonly values"
    type: llm
    severity: warning
    category: "performance"
    message: "Use const references for non-mutating parameters and range-loop variables of non-trivial types to avoid unnecessary copies."
    llm:
      prompt: "Use const references for non-mutating parameters and range-loop variables of non-trivial types to avoid unnecessary copies."
  - id: "avoid-unnecessary-allocations-and-lookups-in-hot-paths"
    name: "Avoid hot-path allocations and repeated lookups"
    type: llm
    severity: warning
    category: "performance"
    message: "In frequently called paths, avoid per-iteration allocations and repeated settings/string lookups by reusing objects and caching values."
    llm:
      prompt: "In frequently called paths, avoid per-iteration allocations and repeated settings/string lookups by reusing objects and caching values."
  - id: "use-stringname-constants-appropriately"
    name: "Use StringName constants appropriately"
    type: llm
    severity: warning
    category: "performance"
    message: "Use SceneStringName/CoreStringName/SNAME for common static identifiers, but avoid introducing one-off StringName construction where it is unnecessary."
    llm:
      prompt: "Use SceneStringName/CoreStringName/SNAME for common static identifiers, but avoid introducing one-off StringName construction where it is unnecessary."
  - id: "guard-and-preserve-deprecated-apis"
    name: "Guard and preserve deprecated APIs"
    type: llm
    severity: warning
    category: "patterns"
    message: "When deprecating methods, signals, properties, or members, keep compatibility behavior and wrap declarations/usage/implementation consistently with DISABLE_DEPRECATED guards."
    llm:
      prompt: "When deprecating methods, signals, properties, or members, keep compatibility behavior and wrap declarations/usage/implementation consistently with DISABLE_DEPRECATED guards."
  - id: "avoid-runtime-editor-coupling"
    name: "Keep runtime and core independent from editor/modules"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not introduce dependencies from runtime/core code to editor or module code; use neutral abstractions or editor-side helpers."
    llm:
      prompt: "Do not introduce dependencies from runtime/core code to editor or module code; use neutral abstractions or editor-side helpers."
  - id: "validate-null-and-parameter-ranges"
    name: "Validate required inputs and documented ranges"
    type: llm
    severity: warning
    category: "security"
    message: "Fail fast on required null pointers/handles and enforce documented parameter constraints with runtime checks before use."
    llm:
      prompt: "Fail fast on required null pointers/handles and enforce documented parameter constraints with runtime checks before use."
  - id: "preserve-api-and-enum-compatibility"
    name: "Preserve public API compatibility"
    type: llm
    severity: warning
    category: "patterns"
    message: "Do not rename/remove public properties or alter enum numeric semantics without compatibility handling and migration-safe behavior."
    llm:
      prompt: "Do not rename/remove public properties or alter enum numeric semantics without compatibility handling and migration-safe behavior."
  - id: "avoid-fragile-ui-and-menu-assumptions"
    name: "Avoid fragile UI index/order assumptions"
    type: llm
    severity: warning
    category: "style"
    message: "Use stable identifiers instead of positional indices and keep behavior robust to insertion/reordering and off-screen/optional UI states."
    llm:
      prompt: "Use stable identifiers instead of positional indices and keep behavior robust to insertion/reordering and off-screen/optional UI states."
  - id: "use-internal-linkage-for-file-local-helpers"
    name: "Use internal linkage for file-local helpers"
    type: llm
    severity: warning
    category: "style"
    message: "Declare helper functions with internal linkage (for example static) when they are only used within one translation unit."
    llm:
      prompt: "Declare helper functions with internal linkage (for example static) when they are only used within one translation unit."
  - id: "avoid-unsafe-or-noop-casts"
    name: "Avoid const-breaking and no-op casts"
    type: llm
    severity: warning
    category: "style"
    message: "Do not cast away constness or add ineffective const qualifiers; model intended mutability explicitly in APIs or fields."
    llm:
      prompt: "Do not cast away constness or add ineffective const qualifiers; model intended mutability explicitly in APIs or fields."
  - id: "keep-binding-and-storage-types-consistent"
    name: "Keep script binding types consistent"
    type: llm
    severity: warning
    category: "patterns"
    message: "Script-exposed property and method types must match backing storage and engine scripting conventions to avoid truncation and conversion bugs."
    llm:
      prompt: "Script-exposed property and method types must match backing storage and engine scripting conventions to avoid truncation and conversion bugs."
  - id: "exclude-derived-readonly-inspector-data-from-serialization"
    name: "Do not serialize derived read-only inspector data"
    type: llm
    severity: warning
    category: "patterns"
    message: "Computed inspector-only values that should not be edited or saved must use non-serialized usage flags (such as PROPERTY_USAGE_NONE)."
    llm:
      prompt: "Computed inspector-only values that should not be edited or saved must use non-serialized usage flags (such as PROPERTY_USAGE_NONE)."
  - id: "remove-dead-code-and-assets-together"
    name: "Remove dead code and related assets together"
    type: llm
    severity: warning
    category: "patterns"
    message: "When removing the final usage of an asset or path, remove the corresponding unused asset/files in the same change."
    llm:
      prompt: "When removing the final usage of an asset or path, remove the corresponding unused asset/files in the same change."
  - id: "preserve-required-base-calls-in-overrides"
    name: "Preserve required base calls in overrides"
    type: llm
    severity: warning
    category: "patterns"
    message: "In overridden lifecycle/update methods, call the parent implementation when required by engine contracts."
    llm:
      prompt: "In overridden lifecycle/update methods, call the parent implementation when required by engine contracts."
  - id: "do-not-include-cpp-implementation-files"
    name: "Do not include .cpp files"
    type: llm
    severity: warning
    category: "style"
    message: "Never include implementation .cpp files from other compilation units; include headers or refactor declarations instead."
    llm:
      prompt: "Never include implementation .cpp files from other compilation units; include headers or refactor declarations instead."
  - id: "prefer-typed-apis-over-dynamic-property-sets"
    name: "Prefer explicit typed APIs"
    type: llm
    severity: warning
    category: "style"
    message: "For known concrete types and stable interfaces, use typed arguments/casts and typed setters instead of weakly typed dynamic set patterns."
    llm:
      prompt: "For known concrete types and stable interfaces, use typed arguments/casts and typed setters instead of weakly typed dynamic set patterns."
  - id: "do-not-defer-queue-free"
    name: "Do not wrap queue_free in call_deferred"
    type: llm
    severity: warning
    category: "performance"
    message: "Call queue_free() directly instead of call_deferred(\"queue_free\") since queue_free is already deferred-safe."
    llm:
      prompt: "Call queue_free() directly instead of call_deferred(\"queue_free\") since queue_free is already deferred-safe."
  - id: "protect-export-destination-paths"
    name: "Disallow export outputs to res://"
    type: llm
    severity: warning
    category: "security"
    message: "Do not allow export/build outputs to target res:// paths because this can overwrite project source files."
    llm:
      prompt: "Do not allow export/build outputs to target res:// paths because this can overwrite project source files."
  - id: "preserve-critical-ci-safety-gates"
    name: "Preserve critical CI safety gates"
    type: llm
    severity: warning
    category: "security"
    message: "Do not remove required workflow triggers, compatibility checks, trusted-branch secret restrictions, or recursive submodule checkout needed for secure and complete CI validation."
    llm:
      prompt: "Do not remove required workflow triggers, compatibility checks, trusted-branch secret restrictions, or recursive submodule checkout needed for secure and complete CI validation."
